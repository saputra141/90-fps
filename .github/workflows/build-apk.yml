name: Build 90-FPS Complete Windows Runtime

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 90fps-complete-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 90-FPS (Winlator engine + bundled runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout 90-FPS
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          else
            echo "::error::Android sdkmanager was not found in the preinstalled SDK."
            find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -type f -print
            exit 1
          fi

      - name: Install Android build packages
        run: |
          set -eu
          # sdkmanager may close the license input early; do not let yes(1)'s
          # expected SIGPIPE abort the workflow.
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Fetch Winlator engine and all pinned submodules
        run: |
          git clone --depth 1 --branch v11.2.0 --recurse-submodules \
            https://github.com/brunodev85/winlator.git upstream
          test -f upstream/app/gradlew
          test -f upstream/app/app/src/main/assets/rootfs.tzst
          test -f upstream/app/app/src/main/assets/box64/box64-0.4.0.tzst
          test -f upstream/app/app/src/main/assets/dxwrapper/dxvk-2.4.1.tzst
          test -f upstream/app/app/src/main/assets/graphics_driver/turnip-26.1.0.tzst
          echo "Pinned Winlator engine and bundled runtime assets verified."

      - name: Bundle official Wine Gecko and Mono installers
        run: |
          set -euo pipefail
          ASSETS="upstream/app/app/src/main/assets/wine_addons"
          mkdir -p "$ASSETS"
          BASE="https://raw.githubusercontent.com/brunodev85/winlator/v11.2.0/wine_addons"
          curl -fL --retry 3 "$BASE/wine-gecko-2.47.4-x86.msi" -o "$ASSETS/wine-gecko-2.47.4-x86.msi"
          curl -fL --retry 3 "$BASE/wine-gecko-2.47.4-x86_64.msi" -o "$ASSETS/wine-gecko-2.47.4-x86_64.msi"
          curl -fL --retry 3 "$BASE/wine-mono-10.1.0-x86.msi" -o "$ASSETS/wine-mono-10.1.0-x86.msi"
          curl -fL --retry 3 "$BASE/wine-mono-9.0.0-x86.msi" -o "$ASSETS/wine-mono-9.0.0-x86.msi"
          for file in "$ASSETS"/*.msi; do
            test -s "$file"
            file "$file"
          done

      - name: Rebrand package as 90-FPS
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("upstream/app")
          gradle = root / "app/build.gradle"
          text = gradle.read_text()
          text = text.replace("applicationId 'com.winlator'", "applicationId 'com.s22winemu.app'")
          text = text.replace("versionCode 28", f"versionCode {int(os.environ['BUILD_NUMBER'])}")
          text = text.replace('versionName "11.1"', f'versionName "0.2.{os.environ["BUILD_NUMBER"]}"')
          # Some native libraries are exposed both through jniLibs and CMake
          # IMPORTED targets. Keep one packaged copy of each duplicated ARM64
          # library so AGP's MergeNativeLibs task can complete.
          packaging = """    packagingOptions {
                  pickFirst 'lib/arm64-v8a/libFLAC.so'
                  pickFirst 'lib/arm64-v8a/libfluidsynth-assetloader.so'
                  pickFirst 'lib/arm64-v8a/libfluidsynth.so'
                  pickFirst 'lib/arm64-v8a/libgio-2.0.so'
                  # Resolve any additional duplicate native .so files exposed
                  # by both jniLibs and CMake IMPORTED targets.
                  pickFirst '**/*.so'
              }

          """
          if "packagingOptions {" not in text:
              text = text.replace("    buildTypes {", packaging + "    buildTypes {", 1)
          else:
              for lib in [
                  "libFLAC.so",
                  "libfluidsynth-assetloader.so",
                  "libfluidsynth.so",
                  "libgio-2.0.so",
              ]:
                  rule = f"pickFirst 'lib/arm64-v8a/{lib}'"
                  if rule not in text:
                      text = text.replace(
                          "    packagingOptions {",
                          "    packagingOptions {\n        " + rule,
                          1
                      )
          if "applicationId 'com.s22winemu.app'" not in text:
              raise SystemExit("Could not safely rebrand Android applicationId")
          gradle.write_text(text)

          strings = root / "app/src/main/res/values/strings.xml"
          text = strings.read_text()
          text = text.replace('<string name="app_name">Winlator</string>',
                              '<string name="app_name">90-FPS</string>', 1)
          strings.write_text(text)

          manifest = root / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text().replace(
              "com.winlator.FileProvider", "com.s22winemu.app.FileProvider"
          )
          manifest.write_text(text)

          assets = root / "app/src/main/assets/THIRD_PARTY_NOTICES"
          assets.mkdir(parents=True, exist_ok=True)
          (assets / "WINLATOR-LICENSE-LGPL-2.1.txt").write_text(
              Path("upstream/LICENSE").read_text()
          )
          app_license = Path("upstream/app/LICENSE")
          if app_license.exists():
              (assets / "WINLATOR-APP-LICENSE-LGPL-2.1.txt").write_text(
                  app_license.read_text()
              )
          (assets / "NOTICE.txt").write_text(
              "90-FPS includes the Winlator Android application engine from "
              "https://github.com/brunodev85/winlator (v11.2.0) and its pinned "
              "source submodules. Winlator is distributed under LGPL-2.1. "
              "Third-party components retain their respective upstream licenses. "
              "See the accompanying source archive and upstream repositories "
              "for complete notices and source code. 90-FPS is an independent "
              "rebranded build and is not an official Winlator release.\n"
          )
          PY

      - name: Build complete ARM64 APK
        working-directory: upstream/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK and bundled runtime
        run: |
          set -e
          APK="upstream/app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" "release/90-FPS-v0.2.${GITHUB_RUN_NUMBER}-arm64.apk"
          ls -lh release/*.apk
          unzip -l "$APK" | grep -E 'assets/(rootfs|box64|dxwrapper|graphics_driver)' | head -40
          unzip -l "$APK" | grep -q 'assets/rootfs.tzst'
          unzip -l "$APK" | grep -q 'assets/box64/box64-0.4.0.tzst'
          unzip -l "$APK" | grep -q 'assets/dxwrapper/dxvk-2.4.1.tzst'
          unzip -l "$APK" | grep -q 'assets/graphics_driver/turnip-26.1.0.tzst'

      - name: Package corresponding upstream source and submodules
        run: |
          tar -czf "release/90-FPS-source-Winlator-v11.2.0.tar.gz" \
            --exclude='.git' upstream
          ls -lh release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 90-FPS-Complete-ARM64
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish 90-FPS complete runtime release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: 90-FPS v0.2.${{ github.run_number }} - Complete Runtime
          body: |
            90-FPS ARM64 build using the Winlator v11.2.0 engine and pinned source submodules.

            Bundled assets are verified in the APK: Ubuntu RootFS, Box64, Wine runtime assets,
            Turnip graphics driver, DXVK, VKD3D, D8VK and supporting components.

            First launch installs the bundled system files into app storage. Allow the initial
            installation to finish and keep sufficient free storage available.

            This is an independent rebranded build, not an official Winlator release.
            The corresponding upstream source and submodules are attached for license compliance.
          files: release/*
          draft: false
          prerelease: true
