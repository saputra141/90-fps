
name: Build S22 WinEmu APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build S22 WinEmu
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install Android SDK, NDK & CMake
      - name: Install Android SDK Components
        run: |
          set -e

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Verify Environment
      - name: Verify Build Environment
        run: |
          java -version
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK Version: 26.3.11579264"

      # 7. Build Debug APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # 8. Check APK Output
      - name: Verify APK Output
        run: |
          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found!"
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          find "$APK_DIR" -name "*.apk"

      # 9. Upload APK Artifact
      - name: Upload S22 WinEmu APK
        uses: actions/upload-artifact@v4
        with:
          name: S22WinEmu-SD8Gen1-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
