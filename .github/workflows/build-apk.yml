name: Build S22 WinEmu APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build S22 WinEmu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Components
        run: |
          set -e
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Build Environment
        run: |
          java -version
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK Version: 26.3.11579264"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found!"
            exit 1
          fi
          APK_COUNT=$(find "$APK_DIR" -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi
          echo "APK successfully generated:"
          find "$APK_DIR" -name "*.apk"

      - name: Prepare Release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/S22-WinEmu-v0.1.${GITHUB_RUN_NUMBER}-arm64-debug.apk"

      - name: Upload S22 WinEmu APK
        uses: actions/upload-artifact@v4
        with:
          name: S22WinEmu-SD8Gen1-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: S22 WinEmu v0.1.${{ github.run_number }}
          body: |
            S22 WinEmu early preview for Samsung Galaxy S22 Ultra Snapdragon 8 Gen 1 (ARM64).

            **Important:** This is an early debug preview. A successful APK build does not mean all Windows applications or PC games are supported. Wine/Box64 runtime and game compatibility remain under development.
          files: release/*.apk
          draft: false
          prerelease: true
