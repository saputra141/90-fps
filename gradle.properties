# AndroidX is required by Jetpack Compose and AndroidX libraries.
android.useAndroidX=true

# Keep builds stable on GitHub Actions runners.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin compiler uses the Kotlin 2.0 Compose compiler plugin.
kotlin.code.style=official
