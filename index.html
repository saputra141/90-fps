    function copyTextSafely(text, successMsg) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast(successMsg || (state.lang === "id" ? "Disalin ke clipboard!" : "Copied to clipboard!"));
      } catch (e) {
        showToast("Clipboard unavailable");
      }
      document.body.removeChild(ta);

                    canStartBuild

                      : "bg-elevated text-textMuted border border-borderSubtle cursor-not-allowed"

          <!-- POST-BUILD APK VALIDATION GATEKEEPER CARD -->

            <section class="bg-emeraldSuccess/12 border border-emeraldSuccess rounded-xl p-4 space-y-2.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-emeraldSuccess"></span>
                  <span class="font-mono text-xs sm:text-sm font-bold text-emeraldSuccess">BUILD SUCCESS • APK TERVALIDASI</span>
                </div>
                <button onclick="openApkInspectorModal()" class="min-h-[38px] px-3.5 py-1.5 rounded-lg bg-emeraldSuccess text-obsidian font-bold text-xs hover:bg-emeraldSuccess/90 transition">
                  ${t("btn_inspect_apk")}
                </button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 font-mono text-[11px] text-textPrimary">
                <div class="bg-obsidian/60 px-2.5 py-1.5 rounded border border-emeraldSuccess/30">✓ AndroidManifest.xml (Binary)</div>
                <div class="bg-obsidian/60 px-2.5 py-1.5 rounded border border-emeraldSuccess/30">✓ ELF EM_AARCH64 (0x00B7)</div>
                <div class="bg-obsidian/60 px-2.5 py-1.5 rounded border border-emeraldSuccess/30">✓ Size: ${p.apkSizeKb.toLocaleString()} KB</div>
                <div class="bg-obsidian/60 px-2.5 py-1.5 rounded border border-emeraldSuccess/30">✓ ApkVerifier v2/v3: VALID</div>
              </div>
            </section>
          ` : ""}

          <!-- LIVE STREAMING TERMINAL CONSOLE -->
          <section class="bg-terminalBg border border-borderSubtle rounded-xl overflow-hidden flex flex-col">
            <div class="bg-panel px-3 py-2 border-b border-borderSubtle flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-1.5">
                ${["ALL", "WARNINGS", "ERRORS"].map(f => `
                  <button onclick="setLogFilter('${f}')" class="px-2.5 py-1 rounded-md font-mono text-[11px] font-semibold transition ${
                    state.logFilter === f
                      ? "bg-cyanAccent/20 text-cyanAccent border border-cyanAccent/40"
                      : "bg-elevated text-textSecondary hover:text-textPrimary"
                  }">${f}</button>
                `).join("")}
              </div>
              <button onclick="copyTextSafely(state.buildLogs.join('\\n'))" class="px-2.5 py-1 rounded-md bg-elevated border border-borderSubtle hover:border-cyanAccent text-xs font-mono text-textSecondary hover:text-textPrimary transition">
                ${t("btn_copy_logs")}
              </button>
            </div>

            <div id="build-terminal-scroll" class="p-3.5 h-64 overflow-y-auto font-mono text-xs space-y-1.5 leading-relaxed">
              ${filteredLogs.map((line, idx) => {
                let color = "text-textSecondary";
                if (line.includes("BUILD SUCCESS")) color = "text-emeraldSuccess font-bold";
                else if (line.toLowerCase().includes("error") || line.toLowerCase().includes("blocker")) color = "text-coralError";
                else if (line.toLowerCase().includes("warning")) color = "text-amberWarning";
                else if (line.startsWith("[")) color = "text-cyanAccent";
                return `<div class="${color}"><span class="text-textMuted select-none mr-2">${String(idx + 1).padStart(2, "0")} |</span>${escapeHtml(line)}</div>`;

    function selectProjectInBuild(projectId) {
      cancelBuild(false);
      state.selectedProjectId = projectId;
      state.buildStage = "IDLE";
      state.buildProgress = 0;
      state.buildDurationMs = null;
      const p = getSelectedProject();
      state.buildLogs = [
        `[SELECTED] Proyek aktif: ${p.name} (${p.engineLabel})`,
        `[TARGET] Package ID: ${p.packageId} • ABI: arm64-v8a`
      ];
      document.getElementById("header-active-project").textContent = p.name;
      renderActiveScreen();
    }

    function toggleSimFlag(flagName) {
      state[flagName] = !state[flagName];
      renderActiveScreen();
    }

    function setLogFilter(filter) {
      state.logFilter = filter;
      renderActiveScreen();
    }

    function handleStartBuildClick() {
      const p = getSelectedProject();
      if (state.simConfirmLarge || p.estStorageMb >= 1500) {
        openModal(
          state.lang === "id" ? "Konfirmasi Build Besar" : "Confirm Large Build",
          `<p>${state.lang === "id"
            ? `Proyek <strong>${p.name}</strong> membutuhkan estimasi <strong>${p.estRamMb} MB RAM</strong> dan <strong>${p.estStorageMb} MB penyimpanan bebas</strong> untuk kompilasi ARM64 on-device. Lanjutkan?`
            : `Project <strong>${p.name}</strong> requires an estimated <strong>${p.estRamMb} MB RAM</strong> and <strong>${p.estStorageMb} MB free storage</strong> for on-device ARM64 compilation. Proceed?`
          }</p>`,
          `
            <button onclick="closeModal()" class="px-4 py-2 rounded-lg bg-elevated text-textSecondary text-xs font-semibold">${state.lang === "id" ? "Batal" : "Cancel"}</button>
            <button onclick="closeModal(); startSimulatedBuild();" class="px-4 py-2 rounded-lg bg-cyanAccent text-obsidian text-xs font-bold">${state.lang === "id" ? "Mulai Kompilasi" : "Start Compilation"}</button>
          `
        );
      } else {
        startSimulatedBuild();
      }
    }

    function startSimulatedBuild() {
      const p = getSelectedProject();
      const steps = p.buildSteps.length > 0 ? p.buildSteps : [
        "[1/5] Preparing ARM64 build workspace...",
        "[2/5] Compiling native libraries...",
        "[3/5] Packaging resources with AAPT2...",
        "[4/5] Aligning archive with zipalign -p 4...",
        "[5/5] Signing APK with apksig...",
        "BUILD SUCCESS: Validated ARM64 APK."
      ];

      state.buildStage = "RUNNING";
      state.buildProgress = 8;
      state.buildDurationMs = null;
      state.buildLogs = [`[START] Memulai build on-device untuk ${p.name} (arm64-v8a)...`];
      renderActiveScreen();

      const startTime = performance.now();
      let stepIndex = 0;

      state.buildTimerId = setInterval(() => {
        if (stepIndex < steps.length) {
          state.buildLogs.push(steps[stepIndex]);
          stepIndex++;
          state.buildProgress = Math.min(98, Math.round((stepIndex / steps.length) * 100));
          renderActiveScreen();
        } else {
          clearInterval(state.buildTimerId);
          state.buildTimerId = null;
          state.buildStage = "SUCCEEDED_VALIDATED";
          state.buildProgress = 100;
          state.buildDurationMs = Math.round(performance.now() - startTime);
          renderActiveScreen();
        }
      }, 320);
    }

    function cancelBuild(shouldRender = true) {
      if (state.buildTimerId) {
        clearInterval(state.buildTimerId);
        state.buildTimerId = null;
      }
      if (state.buildStage === "RUNNING") {
        state.buildStage = "IDLE";
        state.buildLogs.push("[CANCELLED] Proses kompilasi dihentikan secara aman oleh pengguna (Process.destroyForcibly).");
      }
      if (shouldRender) renderActiveScreen();
    }

    function attachBuildLogAutoScroll() {
      const el = document.getElementById("build-terminal-scroll");
      if (el) el.scrollTop = el.scrollHeight;
    }

    // =========================================================================
    // SCREEN 4: DESAINER KONTROL SENTUH (INTERACTIVE DRAG-AND-DROP DESIGNER)
    // =========================================================================
    function renderTouchControlsScreen() {
      const p = getSelectedProject();
      const selected = state.controls.find(c => c.id === state.selectedControlId) || null;
      const jsonExport = JSON.stringify({
        schema_version: 1,
        target_project: p.packageId,
        controls: state.controls.map(c => ({
          id: c.id,
          type: c.type,
          label: c.label,

    function attachCanvasDragHandlers() {
      const canvas = document.getElementById("touch-viewport-canvas");
      if (!canvas) return;

      let draggingId = null;

      function getClientXY(ev) {
        if (ev.touches && ev.touches.length > 0) {
          return { clientX: ev.touches[0].clientX, clientY: ev.touches[0].clientY };
        }
        return { clientX: ev.clientX, clientY: ev.clientY };
      }

      function onStart(ev) {
        const node = ev.target.closest(".touch-control-node");
        if (!node) return;
        ev.preventDefault();
        draggingId = node.getAttribute("data-ctrl-id");
        state.selectedControlId = draggingId;
        // Highlight selection without destroying DOM mid-drag
        canvas.querySelectorAll(".touch-control-node").forEach(el => {
          const isMatch = el.getAttribute("data-ctrl-id") === draggingId;
          el.classList.toggle("border-cyanAccent", isMatch);
          el.classList.toggle("shadow-lg", isMatch);
        });
      }

      function onMove(ev) {
        if (!draggingId) return;
        ev.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const { clientX, clientY } = getClientXY(ev);
        let nx = (clientX - rect.left) / rect.width;
        let ny = (clientY - rect.top) / rect.height;
        nx = Math.max(0.06, Math.min(0.94, nx));
        ny = Math.max(0.10, Math.min(0.90, ny));

        if (state.snapToGrid) {
          nx = Math.round(nx * 32) / 32;
          ny = Math.round(ny * 18) / 18;
        }

        const ctrl = state.controls.find(c => c.id === draggingId);
        if (ctrl) {
          ctrl.x = nx;
          ctrl.y = ny;
          const el = canvas.querySelector(`[data-ctrl-id="${draggingId}"]`);
          if (el) {
            el.style.left = `${(nx * 100).toFixed(2)}%`;
            el.style.top = `${(ny * 100).toFixed(2)}%`;
          }
        }
      }

      function onEnd() {
        if (draggingId) {
          draggingId = null;
          renderActiveScreen();
        }
      }

      canvas.addEventListener("mousedown", onStart);
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onEnd);

      canvas.addEventListener("touchstart", onStart, { passive: false });
      window.addEventListener("touchmove", onMove, { passive: false });
      window.addEventListener("touchend", onEnd);
    }

    function addTouchControl(type) {
      const idx = state.controls.length + 1;
      const newCtrl = {
        id: `ctrl-${Date.now()}`,
        type,
        label: type === "JOYSTICK" ? `JOY${idx}` : `B${idx}`,
        x: 0.50,
        y: 0.50,
        radius: type === "JOYSTICK" ? 48 : 30,
        opacity: 0.85,
        sensitivity: 1.0,
        deadzone: type === "JOYSTICK" ? 0.12 : 0.0,
        binding: type === "JOYSTICK" ? "MOUSE_DELTA_XY" : "KEYCODE_ENTER"
      };
      state.controls.push(newCtrl);
      state.selectedControlId = newCtrl.id;
      renderActiveScreen();
    }

    function updateSelectedControl(prop, value) {
      const ctrl = state.controls.find(c => c.id === state.selectedControlId);
      if (!ctrl) return;
      ctrl[prop] = value;
      renderActiveScreen();
    }

    function deleteSelectedControl() {
      state.controls = state.controls.filter(c => c.id !== state.selectedControlId);
      state.selectedControlId = state.controls[0]?.id || null;

      const responses = {
        dx11: {

          aId: "1) Ganti WinMain/HWND dengan ANativeActivity_onCreate dan eglCreateWindowSurface. 2) Terjemahkan shader HLSL SM 5.0 ke GLSL ES 3.00 (#version 300 es). 3) Setujui patch 'src/RendererGLES3.cpp' di panel kiri lalu buka Pusat Build untuk mengompilasi biner ARM64.",
          aEn: "1) Replace WinMain/HWND with ANativeActivity_onCreate and eglCreateWindowSurface. 2) Translate HLSL SM 5.0 shaders to GLSL ES 3.00 (#version 300 es). 3) Approve the 'src/RendererGLES3.cpp' patch on the left and open Build Center to compile the ARM64 binary."
        },
        nativeactivity: {

          aId: "Karena android.app.NativeActivity sudah tersedia di dalam Android OS framework. Dengan android:hasCode=\"false\", game C/C++ Anda yang dikompilasi ke lib/arm64-v8a/libpc2android_game.so berjalan langsung di ART/Bionic tanpa memerlukan compiler javac atau d8 di ponsel.",
          aEn: "Because android.app.NativeActivity already resides inside the Android OS framework. Setting android:hasCode=\"false\" lets your C/C++ game compiled into lib/arm64-v8a/libpc2android_game.so execute directly on ART/Bionic without needing javac or d8 on the phone."
